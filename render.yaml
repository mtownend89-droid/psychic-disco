services:
  - type: web
    name: matt-dana-finance
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 3000
