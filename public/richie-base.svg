<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" width="380" height="500">
<!-- ============ RICHIE — fanned cash-stack mascot (for Rive) ============
  Original cartoon money-mascot in the popular "stack of bills" style: a fanned bundle of
  banknotes with a gold cash-strap ($ medallion), big cartoon face, white-gloved hands
  (one waving, one presenting), and green sneakers. Optional speech bubble (#speech).
  Named riggable groups: pupil_left/right · eye_left/right · brow_left/right · mouth ·
  cheek_* · glove_left/right (in arm_left/right) · leg_left/right · bill_front · Richie(root).
  Recolor / re-rig freely in Rive.
================================================================================= -->
  <defs>
    <linearGradient id="billFront" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#9ad86a"/><stop offset="1" stop-color="#79c24d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d271"/><stop offset="0.5" stop-color="#e6b23e"/><stop offset="1" stop-color="#cf9526"/></linearGradient>
  </defs>

  <g id="Richie">

    <ellipse cx="182" cy="482" rx="112" ry="15" fill="#1f3b22" opacity="0.18"/>

    <!-- legs + shoes -->
    <g id="legs">
      <g id="leg_left">
        <path d="M152 356 C146 384 142 408 142 426" fill="none" stroke="#5faa3d" stroke-width="16" stroke-linecap="round"/>
        <g id="shoe_left" transform="translate(133 444)">
          <path d="M-22 -8 C-25 6 -12 11 6 10 L16 10 C24 9 26 2 22 -4 C10 -10 -8 -10 -22 -8 Z" fill="#6fbf49" stroke="#256a2a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-23 6 C-10 13 12 12 24 8 L24 12 C10 16 -12 16 -24 11 Z" fill="#ffffff" stroke="#256a2a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M-8 -6 Q-1 -1 8 -4" fill="none" stroke="#256a2a" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
      <g id="leg_right">
        <path d="M204 356 C210 384 214 408 216 426" fill="none" stroke="#5faa3d" stroke-width="16" stroke-linecap="round"/>
        <g id="shoe_right" transform="translate(227 444) scale(-1 1)">
          <path d="M-22 -8 C-25 6 -12 11 6 10 L16 10 C24 9 26 2 22 -4 C10 -10 -8 -10 -22 -8 Z" fill="#6fbf49" stroke="#256a2a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-23 6 C-10 13 12 12 24 8 L24 12 C10 16 -12 16 -24 11 Z" fill="#ffffff" stroke="#256a2a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M-8 -6 Q-1 -1 8 -4" fill="none" stroke="#256a2a" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- arms + gloved hands -->
    <g id="arms">
      <g id="arm_left">
        <path d="M132 288 C112 252 92 202 82 170" fill="none" stroke="#5faa3d" stroke-width="16" stroke-linecap="round"/>
        <g id="glove_left" transform="translate(76 156) rotate(-12)" fill="#ffffff" stroke="#256a2a" stroke-width="3" stroke-linejoin="round">
          <rect x="-16" y="-31" width="7.5" height="25" rx="3.75"/>
          <rect x="-6.5" y="-35" width="7.5" height="29" rx="3.75"/>
          <rect x="3" y="-34" width="7.5" height="28" rx="3.75"/>
          <rect x="12.5" y="-29" width="7.5" height="23" rx="3.75"/>
          <path d="M-15 -3 C-28 -5 -31 -16 -25 -21 C-18 -16 -13 -11 -9 -7 Z"/>
          <circle cx="0" cy="-2" r="16"/>
        </g>
      </g>
      <g id="arm_right">
        <path d="M236 302 C262 308 286 314 302 322" fill="none" stroke="#5faa3d" stroke-width="16" stroke-linecap="round"/>
        <g id="glove_right" transform="translate(308 322) rotate(38)" fill="#ffffff" stroke="#256a2a" stroke-width="3" stroke-linejoin="round">
          <rect x="-16" y="-31" width="7.5" height="25" rx="3.75"/>
          <rect x="-6.5" y="-35" width="7.5" height="29" rx="3.75"/>
          <rect x="3" y="-34" width="7.5" height="28" rx="3.75"/>
          <rect x="12.5" y="-29" width="7.5" height="23" rx="3.75"/>
          <path d="M-15 -3 C-28 -5 -31 -16 -25 -21 C-18 -16 -13 -11 -9 -7 Z"/>
          <circle cx="0" cy="-2" r="16"/>
        </g>
      </g>
    </g>

    <!-- fanned bill stack (back → front) -->
    <g id="stack">
      <g id="bill3" transform="rotate(22 150 356)">
        <rect x="116" y="150" width="118" height="212" rx="16" fill="#4f9c34" stroke="#256a2a" stroke-width="4.5"/>
        <g transform="translate(140 172) scale(1.3)" fill="none" stroke="#2f6b2f" stroke-width="1.6" stroke-linecap="round"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
      </g>
      <g id="bill2" transform="rotate(11 150 356)">
        <rect x="116" y="150" width="118" height="212" rx="16" fill="#67b944" stroke="#256a2a" stroke-width="4.5"/>
        <g transform="translate(150 172) scale(1.3)" fill="none" stroke="#2f6b2f" stroke-width="1.6" stroke-linecap="round"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
      </g>
      <g id="bill_front">
        <rect x="116" y="150" width="118" height="212" rx="16" fill="url(#billFront)" stroke="#256a2a" stroke-width="4.5"/>
        <path d="M206 156 C222 210 222 300 210 352 C220 352 226 346 226 340 L226 168 C226 160 216 156 206 156 Z" fill="#5aa63c" opacity="0.35"/>
        <rect x="124" y="158" width="102" height="196" rx="11" fill="none" stroke="#3f8a3f" stroke-width="1.5" opacity="0.55"/>
        <g fill="none" stroke="#3f8a3f" stroke-width="1.6" stroke-linecap="round">
          <g transform="translate(133 170) scale(1.25)"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
          <g transform="translate(217 170) scale(1.25)"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
          <g transform="translate(133 344) scale(1.25)"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
          <g transform="translate(217 344) scale(1.25)"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
        </g>
      </g>
    </g>

    <!-- gold cash strap -->
    <g id="band">
      <rect x="108" y="300" width="184" height="34" rx="9" fill="url(#gold)" stroke="#a9761c" stroke-width="3"/>
      <path d="M110 304 Q200 300 290 304" fill="none" stroke="#fbe6a6" stroke-width="2.5" opacity="0.8"/>
      <path d="M110 330 Q200 334 290 330" fill="none" stroke="#a9761c" stroke-width="2.5" opacity="0.5"/>
      <circle cx="182" cy="317" r="18" fill="url(#gold)" stroke="#a9761c" stroke-width="3"/>
      <circle cx="182" cy="317" r="13" fill="none" stroke="#a9761c" stroke-width="1.4"/>
      <g transform="translate(182 317) scale(1.7)" fill="none" stroke="#8a6015" stroke-width="1.6" stroke-linecap="round"><path d="M2 -4 C2 -6 -2 -6 -3 -4 C-4 -2 -2 -1 0 0 C2 1 4 2 3 4 C2 6 -2 6 -3 4 M0 -6 L0 6"/></g>
    </g>

    <!-- face -->
    <g id="face">
      <path id="brow_left" d="M132 194 Q152 186 172 195" fill="none" stroke="#256a2a" stroke-width="4" stroke-linecap="round"/>
      <path id="brow_right" d="M180 195 Q200 186 220 194" fill="none" stroke="#256a2a" stroke-width="4" stroke-linecap="round"/>
      <g id="eye_left">
        <ellipse cx="152" cy="223" rx="22" ry="25" fill="#ffffff" stroke="#256a2a" stroke-width="2.5"/>
        <circle id="pupil_left" cx="155" cy="226" r="13" fill="#4caf50" stroke="#2f6b2f" stroke-width="1.5"/>
        <circle cx="155" cy="226" r="6.5" fill="#153a16"/>
        <circle cx="150" cy="220" r="3.6" fill="#ffffff"/>
        <path d="M130 216 Q152 202 174 216" fill="none" stroke="#256a2a" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="eye_right">
        <ellipse cx="198" cy="223" rx="22" ry="25" fill="#ffffff" stroke="#256a2a" stroke-width="2.5"/>
        <circle id="pupil_right" cx="195" cy="226" r="13" fill="#4caf50" stroke="#2f6b2f" stroke-width="1.5"/>
        <circle cx="195" cy="226" r="6.5" fill="#153a16"/>
        <circle cx="190" cy="220" r="3.6" fill="#ffffff"/>
        <path d="M176 216 Q198 202 220 216" fill="none" stroke="#256a2a" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <ellipse id="cheek_left" cx="130" cy="252" rx="15" ry="10" fill="#f4a6b0" opacity="0.8"/>
      <ellipse id="cheek_right" cx="222" cy="252" rx="15" ry="10" fill="#f4a6b0" opacity="0.8"/>
      <g id="mouth">
        <path d="M147 263 Q175 269 203 263 Q197 294 175 296 Q153 294 147 263 Z" fill="#7a2a3a" stroke="#3a1720" stroke-width="3" stroke-linejoin="round"/>
        <path d="M152 265 Q175 270 198 265 L195 275 Q175 279 155 275 Z" fill="#ffffff"/>
        <ellipse cx="175" cy="288" rx="15" ry="8" fill="#ff8fa0"/>
      </g>
    </g>

    <!-- optional speech bubble (delete this group if not needed) -->
    <g id="speech">
      <path d="M36 72 Q36 44 76 44 L146 44 Q186 44 186 72 Q186 100 146 100 L118 100 L98 118 L103 100 L76 100 Q36 100 36 72 Z" fill="#ffffff" stroke="#256a2a" stroke-width="3.5" stroke-linejoin="round"/>
    </g>

  </g>
</svg>
