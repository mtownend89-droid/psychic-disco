<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 500" width="340" height="500">
<!-- ============ RICHIE — dimensional cartoon dollar-bill mascot (TVA-clock styling) ============
  A rippling banknote with real depth: extruded "thickness" layer + ground shadow, cel-shaded
  highlight/shadow, and a segmented "clock bezel" ring behind the portrait (à la the TVA clock).
  Real-bill squared corner "1" numerals; no bottom-center denomination. Rubber-hose arms/legs.
  Named riggable groups for Rive: pupil_left/right · eye_left/right · brow_left/right · mouth ·
  cheek_* · arm_left/right · leg_left/right · bill_body · Richie(root).
  Original stylized bill (not a real-currency facsimile). Recolor freely in Rive.
================================================================================= -->
  <defs>
    <linearGradient id="billGrad" x1="0.1" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#aede9f"/><stop offset="0.5" stop-color="#83c07e"/><stop offset="1" stop-color="#5f9e67"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#254a30" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="portalGrad" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#efe6cf"/>
    </radialGradient>
  </defs>

  <g id="Richie">

    <!-- ground shadow (3D lift) -->
    <ellipse cx="170" cy="480" rx="106" ry="15" fill="#16301f" opacity="0.22"/>

    <!-- legs (behind bill) -->
    <g id="legs">
      <g id="leg_left"><path d="M142 404 C140 428 134 444 132 452" fill="none" stroke="#5f9e67" stroke-width="17" stroke-linecap="round"/><ellipse cx="120" cy="458" rx="29" ry="14" fill="#2b2f36"/><ellipse cx="120" cy="461" rx="29" ry="7" fill="#171a1f"/><ellipse cx="112" cy="454" rx="8" ry="4" fill="#4a4f57"/></g>
      <g id="leg_right"><path d="M198 404 C200 428 206 444 208 452" fill="none" stroke="#5f9e67" stroke-width="17" stroke-linecap="round"/><ellipse cx="220" cy="458" rx="29" ry="14" fill="#2b2f36"/><ellipse cx="220" cy="461" rx="29" ry="7" fill="#171a1f"/><ellipse cx="228" cy="454" rx="8" ry="4" fill="#4a4f57"/></g>
    </g>

    <!-- arms (behind bill) -->
    <g id="arms">
      <g id="arm_left"><path d="M82 214 C56 222 42 246 48 266" fill="none" stroke="#5f9e67" stroke-width="17" stroke-linecap="round"/><circle cx="48" cy="270" r="16" fill="#ffffff" stroke="#3f7a4f" stroke-width="4"/><path d="M40 266 Q48 262 56 266" fill="none" stroke="#c9d6cc" stroke-width="2"/></g>
      <g id="arm_right"><path d="M258 214 C284 222 298 246 292 266" fill="none" stroke="#5f9e67" stroke-width="17" stroke-linecap="round"/><circle cx="292" cy="270" r="16" fill="#ffffff" stroke="#3f7a4f" stroke-width="4"/><path d="M284 266 Q292 262 300 266" fill="none" stroke="#c9d6cc" stroke-width="2"/></g>
    </g>

    <g id="bill">
      <!-- extruded thickness (dimensional) -->
      <path d="M82 104 C84 90 96 84 112 84 C140 84 150 92 170 88 C190 84 214 84 240 86 C252 87 260 92 260 106 C263 180 263 300 259 380 C258 394 250 400 236 399 C214 396 200 404 172 402 C148 400 130 405 108 401 C96 399 80 397 78 384 C74 300 74 180 78 108 C79 100 80 104 82 104 Z" transform="translate(0 9)" fill="#3d6f4c"/>
      <path d="M82 104 C84 90 96 84 112 84 C140 84 150 92 170 88 C190 84 214 84 240 86 C252 87 260 92 260 106 C263 180 263 300 259 380 C258 394 250 400 236 399 C214 396 200 404 172 402 C148 400 130 405 108 401 C96 399 80 397 78 384 C74 300 74 180 78 108 C79 100 80 104 82 104 Z" transform="translate(0 5)" fill="#4d855e"/>

      <!-- top face -->
      <path id="bill_body" d="M82 104 C84 90 96 84 112 84 C140 84 150 92 170 88 C190 84 214 84 240 86 C252 87 260 92 260 106 C263 180 263 300 259 380 C258 394 250 400 236 399 C214 396 200 404 172 402 C148 400 130 405 108 401 C96 399 80 397 78 384 C74 300 74 180 78 108 C79 100 80 104 82 104 Z" fill="url(#billGrad)" stroke="#2c5a3b" stroke-width="5" stroke-linejoin="round"/>
      <path d="M82 104 C84 90 96 84 112 84 C140 84 150 92 170 88 C190 84 214 84 240 86 C252 87 260 92 260 106 C263 180 263 300 259 380 C258 394 250 400 236 399 C214 396 200 404 172 402 C148 400 130 405 108 401 C96 399 80 397 78 384 C74 300 74 180 78 108 C79 100 80 104 82 104 Z" fill="url(#sheen)"/>

      <!-- cel shading -->
      <path d="M92 122 C104 106 124 102 150 106 C132 132 114 172 110 220 C98 200 92 160 92 122 Z" fill="#c4ecb7" opacity="0.4"/>
      <path d="M252 156 C257 224 255 320 245 372 C233 384 216 388 198 386 C216 342 226 262 228 192 C236 182 246 168 252 156 Z" fill="#356b45" opacity="0.28"/>

      <!-- ripple-shading bands (front-to-back flutter) -->
      <g id="ripples">
        <path d="M80 150 C130 138 210 160 260 146 L260 164 C210 178 130 156 80 168 Z" fill="#ffffff" opacity="0.10"/>
        <path d="M78 250 C130 264 210 242 262 258 L262 276 C210 260 130 282 78 268 Z" fill="#254a30" opacity="0.08"/>
        <path d="M80 336 C130 326 210 346 260 332 L260 349 C210 363 130 343 80 353 Z" fill="#ffffff" opacity="0.07"/>
      </g>

      <!-- guilloche field + TVA-style clock bezel behind the portrait -->
      <g id="guilloche" fill="none" stroke="#356b45">
        <ellipse cx="170" cy="205" rx="94" ry="108" stroke-width="0.8" opacity="0.28"/>
        <ellipse cx="170" cy="205" rx="88" ry="102" stroke-width="0.8" opacity="0.24"/>
        <ellipse cx="170" cy="205" rx="82" ry="96" stroke-width="0.8" opacity="0.2"/>
        <circle cx="170" cy="205" r="90" stroke-width="1" opacity="0.4"/>
        <circle cx="170" cy="205" r="84" stroke-width="6" stroke-dasharray="2.5 8.2" opacity="0.5"/>
        <circle cx="170" cy="205" r="77" stroke-width="1" opacity="0.35"/>
      </g>

      <!-- margin hairline engraving -->
      <g stroke="#356b45" stroke-width="0.8" opacity="0.32">
        <line x1="86" y1="140" x2="86" y2="360"/><line x1="90" y1="150" x2="90" y2="350"/><line x1="94" y1="160" x2="94" y2="340"/>
        <line x1="254" y1="140" x2="254" y2="360"/><line x1="250" y1="150" x2="250" y2="350"/><line x1="246" y1="160" x2="246" y2="340"/>
      </g>

      <!-- double wavy guilloche border -->
      <path d="M96 118 C98 106 108 102 122 102 C146 103 156 110 172 106 C190 102 210 103 230 106 C242 107 248 114 248 126 C251 190 251 300 247 372 C246 384 240 389 228 388 C208 385 196 391 172 389 C150 387 134 391 114 388 C104 387 92 381 92 370 C88 300 88 190 92 126 C93 116 94 118 96 118 Z" fill="none" stroke="#2c5a3b" stroke-width="2.5"/>
      <path d="M104 128 C106 118 114 114 126 115 C148 116 158 122 172 118 C188 114 206 115 224 118 C236 119 240 126 240 136 C243 195 243 300 239 366 C238 376 232 381 222 380 C204 377 194 382 172 381 C152 379 138 382 120 380 C110 379 100 374 100 364 C97 300 97 195 100 136 C101 128 102 128 104 128 Z" fill="none" stroke="#356b45" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

      <!-- squared corner "1" numerals (US-bill style) -->
      <g id="corners" fill="#fdf8e9" stroke="#2c5a3b">
        <g transform="translate(116 122)">
          <rect x="-17" y="-17" width="34" height="34" rx="3" stroke-width="2.5"/>
          <rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke-width="1"/>
          <path d="M-17 -8 Q-25 -17 -14 -21 M17 -8 Q25 -17 14 -21 M-17 8 Q-25 17 -14 21 M17 8 Q25 17 14 21" fill="none" stroke-width="1.4" opacity="0.8"/>
          <path d="M-2 -9 L4 -11 L4 7 L8 7 L8 11 L-8 11 L-8 7 L-2 7 L-2 -5 L-6 -4 Z" fill="#2c5a3b" stroke="none"/>
        </g>
        <g transform="translate(224 122)">
          <rect x="-17" y="-17" width="34" height="34" rx="3" stroke-width="2.5"/>
          <rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke-width="1"/>
          <path d="M-17 -8 Q-25 -17 -14 -21 M17 -8 Q25 -17 14 -21 M-17 8 Q-25 17 -14 21 M17 8 Q25 17 14 21" fill="none" stroke-width="1.4" opacity="0.8"/>
          <path d="M-2 -9 L4 -11 L4 7 L8 7 L8 11 L-8 11 L-8 7 L-2 7 L-2 -5 L-6 -4 Z" fill="#2c5a3b" stroke="none"/>
        </g>
        <g transform="translate(116 366)">
          <rect x="-17" y="-17" width="34" height="34" rx="3" stroke-width="2.5"/>
          <rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke-width="1"/>
          <path d="M-17 -8 Q-25 -17 -14 -21 M17 -8 Q25 -17 14 -21 M-17 8 Q-25 17 -14 21 M17 8 Q25 17 14 21" fill="none" stroke-width="1.4" opacity="0.8"/>
          <path d="M-2 -9 L4 -11 L4 7 L8 7 L8 11 L-8 11 L-8 7 L-2 7 L-2 -5 L-6 -4 Z" fill="#2c5a3b" stroke="none"/>
        </g>
        <g transform="translate(224 366)">
          <rect x="-17" y="-17" width="34" height="34" rx="3" stroke-width="2.5"/>
          <rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke-width="1"/>
          <path d="M-17 -8 Q-25 -17 -14 -21 M17 -8 Q25 -17 14 -21 M-17 8 Q-25 17 -14 21 M17 8 Q25 17 14 21" fill="none" stroke-width="1.4" opacity="0.8"/>
          <path d="M-2 -9 L4 -11 L4 7 L8 7 L8 11 L-8 11 L-8 7 L-2 7 L-2 -5 L-6 -4 Z" fill="#2c5a3b" stroke="none"/>
        </g>
      </g>

      <!-- engraved seals flanking the portrait -->
      <g id="seal_left" transform="translate(112 322)">
        <circle r="22" fill="#fdf8e9" stroke="#2c5a3b" stroke-width="2"/>
        <circle r="22" fill="none" stroke="#2c5a3b" stroke-width="2" stroke-dasharray="2.5 3.5"/>
        <circle r="16" fill="none" stroke="#356b45" stroke-width="1"/>
        <path d="M6 0 L13 0 M3 5.2 L6.5 11.3 M-3 5.2 L-6.5 11.3 M-6 0 L-13 0 M-3 -5.2 L-6.5 -11.3 M3 -5.2 L6.5 -11.3" stroke="#356b45" stroke-width="1"/>
        <circle r="4.5" fill="#2c5a3b"/>
        <path d="M-9 -13 A22 22 0 0 1 12 -9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      </g>
      <g id="seal_right" transform="translate(228 322)">
        <circle r="22" fill="#fdf8e9" stroke="#2c5a3b" stroke-width="2"/>
        <circle r="22" fill="none" stroke="#2c5a3b" stroke-width="2" stroke-dasharray="2.5 3.5"/>
        <circle r="16" fill="none" stroke="#356b45" stroke-width="1"/>
        <path d="M6 0 L13 0 M3 5.2 L6.5 11.3 M-3 5.2 L-6.5 11.3 M-6 0 L-13 0 M-3 -5.2 L-6.5 -11.3 M3 -5.2 L6.5 -11.3" stroke="#356b45" stroke-width="1"/>
        <circle r="4.5" fill="#2c5a3b"/>
        <path d="M-9 -13 A22 22 0 0 1 12 -9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      </g>

      <!-- header flourish -->
      <g transform="translate(170 114)">
        <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#fdf8e9" stroke="#2c5a3b" stroke-width="2"/>
        <path d="M-14 0 Q-26 -8 -36 1 Q-28 -3 -19 1" fill="none" stroke="#2c5a3b" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 0 Q26 -8 36 1 Q28 -3 19 1" fill="none" stroke="#2c5a3b" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-40" cy="2" r="2" fill="#2c5a3b"/><circle cx="40" cy="2" r="2" fill="#2c5a3b"/>
      </g>
    </g>

    <!-- portrait filigree brackets -->
    <path d="M99 172 Q90 205 99 238" fill="none" stroke="#2c5a3b" stroke-width="1.5" opacity="0.6"/>
    <path d="M241 172 Q250 205 241 238" fill="none" stroke="#2c5a3b" stroke-width="1.5" opacity="0.6"/>

    <!-- face -->
    <g id="face">
      <ellipse id="face_frame" cx="170" cy="205" rx="64" ry="74" fill="url(#portalGrad)" stroke="#2c5a3b" stroke-width="4"/>
      <ellipse cx="170" cy="205" rx="58" ry="68" fill="none" stroke="#356b45" stroke-width="1" opacity="0.5"/>
      <ellipse id="cheek_left" cx="120" cy="222" rx="15" ry="10" fill="#ff8fa3" opacity="0.55"/>
      <ellipse id="cheek_right" cx="220" cy="222" rx="15" ry="10" fill="#ff8fa3" opacity="0.55"/>
      <rect id="brow_left" x="124" y="160" width="42" height="12" rx="6" fill="#2f5f3d" transform="rotate(-10 145 166)"/>
      <rect id="brow_right" x="174" y="160" width="42" height="12" rx="6" fill="#2f5f3d" transform="rotate(10 195 166)"/>
      <g id="eye_left"><ellipse cx="146" cy="193" rx="20" ry="24" fill="#ffffff" stroke="#2c5a3b" stroke-width="2"/><circle id="pupil_left" cx="150" cy="198" r="10" fill="#22303a"/><circle cx="145" cy="189" r="3.6" fill="#ffffff"/></g>
      <g id="eye_right"><ellipse cx="194" cy="193" rx="20" ry="24" fill="#ffffff" stroke="#2c5a3b" stroke-width="2"/><circle id="pupil_right" cx="190" cy="198" r="10" fill="#22303a"/><circle cx="189" cy="189" r="3.6" fill="#ffffff"/></g>
      <g id="mouth">
        <path d="M137 231 Q170 236 203 231 Q198 270 170 272 Q142 270 137 231 Z" fill="#6e2b3a" stroke="#3a1720" stroke-width="3" stroke-linejoin="round"/>
        <path d="M142 233 Q170 238 198 233 L195 244 Q170 248 145 244 Z" fill="#ffffff"/>
        <ellipse cx="170" cy="262" rx="16" ry="9" fill="#ff7a8f"/>
      </g>
    </g>

  </g>
</svg>
