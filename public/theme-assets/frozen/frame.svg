<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 1200 700'><defs> <!-- DESIGN TOKENS --> <linearGradient id="winterBg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#F8FCFF"/> <stop offset=".45" stop-color="#DFF3FF"/> <stop offset="1" stop-color="#BFD9F5"/> </linearGradient> <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset=".28" stop-color="#D9F7FF"/> <stop offset=".58" stop-color="#8FD8F5"/> <stop offset="1" stop-color="#4D9FD2"/> </linearGradient> <linearGradient id="deepIce" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#4EC4EE"/> <stop offset=".45" stop-color="#2A7FC6"/> <stop offset="1" stop-color="#173E83"/> </linearGradient> <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#8BFFF0"/> <stop offset=".5" stop-color="#7AB9FF"/> <stop offset="1" stop-color="#C28DFF"/> </linearGradient> <linearGradient id="frostGlass" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/> <stop offset=".45" stop-color="#D8F7FF" stop-opacity=".58"/> <stop offset="1" stop-color="#7AB7E8" stop-opacity=".28"/> </linearGradient> <linearGradient id="nightIce" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#1E3F78"/> <stop offset="1" stop-color="#0B1737"/> </linearGradient> <filter id="iceShadow" x="-30%" y="-30%" width="160%" height="180%"> <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#31577F" flood-opacity=".28"/> </filter> <filter id="iceGlow" x="-50%" y="-50%" width="200%" height="200%"> <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#8DEBFF" flood-opacity=".75"/> </filter> <filter id="auroraGlow" x="-50%" y="-50%" width="200%" height="200%"> <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#A58DFF" flood-opacity=".58"/> </filter> <pattern id="snowDots" width="90" height="90" patternUnits="userSpaceOnUse"> <circle cx="12" cy="16" r="2" fill="#FFFFFF" opacity=".75"/> <circle cx="63" cy="29" r="1.3" fill="#FFFFFF" opacity=".55"/> <circle cx="38" cy="70" r="1.7" fill="#E7FAFF" opacity=".8"/> <circle cx="81" cy="79" r=".9" fill="#FFFFFF" opacity=".7"/> </pattern> <!-- PRIMITIVES --> <g id="snowflake"> <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"> <path d="M0-36V36M-31-18 31 18M31-18-31 18"/> <path d="M0-24-7-17M0-24 7-17M0 24-7 17M0 24 7 17"/> <path d="M-20-12-19-3M-20-12-11-13M20 12 19 3M20 12 11 13"/> <path d="M20-12 19-3M20-12 11-13M-20 12-19 3M-20 12-11 13"/> </g> </g> <g id="ice-crystal"> <path d="M0-44 24-18 14 28 0 44-14 28-24-18Z" fill="url(#ice)" stroke="#5CA9D8" stroke-width="4"/> <path d="M0-36V36M-18-16 18 16M18-16-18 16" stroke="#FFFFFF" stroke-width="3" opacity=".75"/> </g> <g id="icicle"> <path d="M-12 0 H12 L8 30 0 58-8 30Z" fill="url(#ice)" stroke="#5CA5D1" stroke-width="3"/> <path d="M-5 6 0 40" stroke="#FFFFFF" stroke-width="3" opacity=".7"/> </g> <g id="star-spark"><path d="M0-18 4-4 18 0 4 4 0 18-4 4-18 0-4-4Z" fill="#FFFFFF"/></g> <g id="snowball"> <circle cx="0" cy="0" r="24" fill="#F7FCFF" stroke="#A9D7EE" stroke-width="4"/> <ellipse cx="-7" cy="-8" rx="9" ry="5" fill="#FFFFFF" opacity=".85"/> </g> <!-- ICONS --> </defs> <rect x="42" y="42" width="1116" height="616" rx="58" fill="url(#nightIce)" stroke="#0B1D42" stroke-width="20" filter="url(#iceShadow)"/> <rect x="66" y="66" width="1068" height="568" rx="43" fill="url(#ice)" stroke="#DDFBFF" stroke-width="16"/> <rect x="88" y="88" width="1024" height="524" rx="30" fill="url(#frostGlass)" stroke="#62BCE9" stroke-width="7"/> <rect x="104" y="104" width="992" height="492" rx="22" fill="#EAF9FF" opacity=".72"/> <rect x="104" y="104" width="992" height="492" rx="22" fill="url(#snowDots)" opacity=".7"/> <!-- top ice crown --> <path d="M450 92 492 42 540 72 600 22 660 72 708 42 750 92 710 128H490Z" fill="url(#ice)" stroke="#5BA8D4" stroke-width="7"/> <path d="M505 89 540 56 600 36 660 56 695 89" fill="none" stroke="#FFFFFF" stroke-width="7" opacity=".75"/> <use href="#ice-crystal" transform="translate(600 64) scale(.58)"/> <!-- icicles --> <g> <use href="#icicle" x="160" y="101" transform="scale(.78)"/> <use href="#icicle" x="250" y="101" transform="scale(.55)"/> <use href="#icicle" x="340" y="101" transform="scale(.7)"/> <use href="#icicle" x="860" y="101" transform="scale(.7)"/> <use href="#icicle" x="950" y="101" transform="scale(.55)"/> <use href="#icicle" x="1040" y="101" transform="scale(.78)"/> </g> <!-- corners --> <use href="#snowflake" transform="translate(110 110) scale(.78)"/> <use href="#snowflake" transform="translate(1090 110) scale(.78)"/> <use href="#snowflake" transform="translate(110 590) scale(.78)"/> <use href="#snowflake" transform="translate(1090 590) scale(.78)"/> <!-- aurora accents --> <path d="M150 125 C330 170 470 95 600 140 C730 95 870 170 1050 125" fill="none" stroke="url(#aurora)" stroke-width="9" stroke-linecap="round" filter="url(#auroraGlow)"/> <path d="M160 575 C340 530 470 605 600 560 C730 605 860 530 1040 575" fill="none" stroke="url(#aurora)" stroke-width="9" stroke-linecap="round" filter="url(#auroraGlow)"/> </svg>