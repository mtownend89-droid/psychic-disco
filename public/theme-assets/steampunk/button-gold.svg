<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns:inkscape='http://www.inkscape.org/namespaces/inkscape' xmlns:sodipodi='http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd' viewBox='0 0 120 55'><defs>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="sheetBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090909"/><stop offset="1" stop-color="#000"/></linearGradient>
<style>.hit-area{fill:#00ffff;fill-opacity:.001}.asset-outline{fill:none;stroke:#f5b84b;stroke-opacity:.08;stroke-width:1}</style>
</defs>
<g id="button-gold" data-asset="button-gold" data-resizable="true" inkscape:groupmode="layer" inkscape:label="Secondary Gold Button">
 <g id="button-gold-glow" inkscape:groupmode="layer" inkscape:label="Glow"><rect x="8" y="8" width="104" height="39" rx="12" fill="#18d5d5" opacity=".06" filter="url(#glow)"/></g>
 <g id="button-gold-shadow" inkscape:groupmode="layer" inkscape:label="Shadow"><rect x="10" y="12" width="100" height="37" rx="12" fill="#000" opacity=".5" filter="url(#shadow)"/></g>
 <g id="button-gold-base" inkscape:groupmode="layer" inkscape:label="Base Metal"><rect width="120" height="55" fill="#050505"/></g>
 <g id="button-gold-art" inkscape:groupmode="layer" inkscape:label="Main Artwork"><image href="data:image/jpeg;base64," x="0" y="0" width="120" height="55" preserveAspectRatio="none"/></g>
 <g id="button-gold-highlights" inkscape:groupmode="layer" inkscape:label="Highlights"><rect x="1" y="1" width="118" height="53" rx="10" class="asset-outline"/></g>
 <g id="button-gold-details" inkscape:groupmode="layer" inkscape:label="Mechanical Details"/>
 <g id="button-gold-reflection" inkscape:groupmode="layer" inkscape:label="Reflection"><path d="M8 8H112" stroke="#fff" stroke-opacity=".035" stroke-width="2"/></g>
 <g id="button-gold-hit" inkscape:groupmode="layer" inkscape:label="Hit Area"><rect class="hit-area" width="120" height="55"/></g>
</g>
</svg>